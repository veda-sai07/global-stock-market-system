spring.application.name=stock-market
server.port=${PORT:8080}

# Database: defaults to in-memory H2 (local dev). In production set DB_URL, DB_USERNAME, DB_PASSWORD
# e.g. DB_URL=jdbc:mysql://HOST:PORT/DBNAME?sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.url=${DB_URL:jdbc:h2:mem:stockdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.h2.console.enabled=${H2_CONSOLE:false}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Frontend URLs allowed to call this API (comma-separated, no trailing slash)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
